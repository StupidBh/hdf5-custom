name: 'Setup Doxygen'
description: 'Install the Doxygen version used to build HDF5 documentation'
inputs:
  version:
    description: 'Doxygen version to install'
    required: false
    default: '1.16.1'
runs:
  using: 'composite'
  steps:
    - name: Install Doxygen
      uses: ssciwr/doxygen-install@f13be1686235deee0aeb6cdf56640170691dc96b # v1
      with:
        version: ${{ inputs.version }}
